[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-director-contracts"
version = "0.1.0"
description = "Design-first contracts for a multi-vendor CLI orchestrator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6.0,<7", "GitPython>=3.1.43,<4", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
